name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # ci, not install: a lockfile that drifted from package.json should fail
      # the build rather than quietly resolve something new.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
